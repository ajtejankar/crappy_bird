name: dev-cycle

# The entire game development lifecycle, employee-free.
# Fired by the web app (repository_dispatch) when the war chest crosses the
# threshold, or by hand (workflow_dispatch) for testing.
#
# SECURITY NOTE: idea text and everything derived from it (release summaries,
# changelog entries) is untrusted, paid-for user content. It must NEVER be
# interpolated into shell via ${{ }} — only via env vars, which the shell
# treats as data. Keep it that way.

on:
  repository_dispatch:
    types: [fund-goal-reached]
  workflow_dispatch: {}

concurrency:
  group: dev-cycle          # one developer. it does not pair-program with itself.

permissions:
  contents: write

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_URL: ${{ secrets.APP_URL }}
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The agent step must hold NO push credentials — otherwise it could
          # `git push` around the gate. The ship step authenticates explicitly.
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: fetch the idea pile
        id: ideas
        run: |
          curl -fsS -H "Authorization: Bearer $AGENT_TOKEN" \
            "$APP_URL/api/agent/ideas" -o agent/ideas.json
          count=$(jq length agent/ideas.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "fetched $count pending idea(s)"

      - name: report empty pile and stop
        if: steps.ideas.outputs.count == '0'
        run: |
          jq -n '{status:"failed", spend_cents:0, summary:"woke up to an empty idea pile. going back to sleep."}' \
            | curl -fsS -X POST "$APP_URL/api/agent/complete" \
                -H "Authorization: Bearer $AGENT_TOKEN" -H "content-type: application/json" -d @-

      - name: install browsers for the verifier
        if: steps.ideas.outputs.count != '0'
        run: uv run agent/verify_game.py install

      - name: install claude code
        if: steps.ideas.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: THE DEVELOPER WORKS
        id: agent
        if: steps.ideas.outputs.count != '0'
        timeout-minutes: 45
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # per-session budget cap in USD; override via a repo variable if needed
          MAX_SESSION_USD: ${{ vars.MAX_SESSION_USD || '8' }}
          # activates the budget-meter hook (.claude/settings.json -> scripts/budget_reminder.py)
          CRAPPY_DEV_RUN: "1"
        run: |
          set +e
          # Budget, three ways:
          #  - enforced: --max-budget-usd (native; counts subagents; kills at cap)
          #  - visible:  the cap is written into the mission brief below
          #  - metered:  the PostToolUse hook injects a spend meter every ~$2
          prompt="$(cat agent/AGENT_PROMPT.md)

          ## THIS RUN'S BUDGET
          You have a hard cap of \$${MAX_SESSION_USD} of API spend for this entire release
          (subagent spend counts). The harness terminates the session the moment the cap
          is reached — mid-thought, no appeal. A BUDGET METER system note will appear
          roughly every \$2 of spend. Scope the work so implementation, verification,
          changelog and release.json all fit comfortably inside the cap."

          # stream-json = the full turn-by-turn transcript (every message, tool
          # call and tool result), one JSON object per line. This is the telemetry.
          claude -p "$prompt" \
            --model claude-opus-5 \
            --dangerously-skip-permissions \
            --verbose \
            --max-turns 250 \
            --max-budget-usd "$MAX_SESSION_USD" \
            --output-format stream-json > agent/claude_transcript.jsonl 2> agent/claude_stderr.log
          echo "claude exit code: $?"

          # price the transcript's usage events (Opus 5: $5/M in, $25/M out,
          # 1.25x cache write, 0.1x cache read). Tolerant of a partial last line.
          # Used as the spend fallback when there's no result event (capped run).
          usage_cost() {
            jq -Rrs '
              [ split("\n")[] | select(length > 0) | (fromjson? // empty)
                | select(.type == "assistant") | .message.usage // empty ]
              | ( map(.input_tokens // 0) | add // 0 ) as $in
              | ( map(.output_tokens // 0) | add // 0 ) as $out
              | ( map(.cache_creation_input_tokens // 0) | add // 0 ) as $cw
              | ( map(.cache_read_input_tokens // 0) | add // 0 ) as $cr
              | ($in * 5 + $out * 25 + $cw * 6.25 + $cr * 0.5) / 1000000
            ' agent/claude_transcript.jsonl 2>/dev/null || echo 0
          }

          # scrub secrets before the transcript leaves this runner in any form —
          # if the agent ever echoes its environment, the key would be in here
          python3 - <<'PY'
          import os, re
          for path in ("agent/claude_transcript.jsonl", "agent/claude_stderr.log"):
              try:
                  s = open(path, encoding="utf-8", errors="replace").read()
              except FileNotFoundError:
                  continue
              for name in ("ANTHROPIC_API_KEY", "AGENT_TOKEN"):
                  v = os.environ.get(name)
                  if v:
                      s = s.replace(v, f"[REDACTED:{name}]")
              s = re.sub(r"sk-ant-[A-Za-z0-9_\-]{8,}", "[REDACTED:key-pattern]", s)
              open(path, "w").write(s)
          PY

          # spend accounting: the result event is authoritative; if the watchdog
          # killed the session there is no result event, so bill the usage sum
          cost=$(jq -r 'select(.type=="result") | .total_cost_usd // empty' agent/claude_transcript.jsonl 2>/dev/null | tail -1)
          [ -z "$cost" ] && cost=$(usage_cost)
          case "$cost" in (''|0) cost=5;; esac
          cents=$(printf '%.0f' "$(echo "$cost * 100" | bc -l)")
          echo "spend_cents=$cents" >> "$GITHUB_OUTPUT"
          echo "developer session cost: \$$cost"
          tail -c 2000 agent/claude_stderr.log || true

      - name: the gate (verify, or it does not ship)
        id: gate
        if: steps.ideas.outputs.count != '0'
        run: |
          set +e
          out() { printf '%s=%s\n' "$1" "$(printf '%s' "$2" | tr '\n\r' '  ' | head -c 400)" >> "$GITHUB_OUTPUT"; }
          fail() { out verdict failed; out reason "$1"; echo "GATE: $1"; exit 0; }

          [ -f agent/release.json ] || fail "developer left no release.json"
          jq empty agent/release.json 2>/dev/null || fail "release.json is not valid JSON"
          version=$(jq -r '.version // empty' agent/release.json)
          idea_id=$(jq -r '.idea_id // empty' agent/release.json)
          summary=$(jq -r '.summary // "no summary"' agent/release.json)
          out summary "$summary"
          [ -n "$version" ] || fail "developer surrendered: $summary"

          old=$(git show HEAD:games/latest.json | jq -r .version)
          [ "$version" -eq "$((old + 1))" ] 2>/dev/null || fail "version '$version' is not $((old + 1))"
          [ "$(jq -r .version games/latest.json)" -eq "$version" ] || fail "latest.json not bumped to $version"
          [ -f "games/index.v${version}.html" ] || fail "games/index.v${version}.html missing"
          case "$idea_id" in (*[!0-9]*|'') fail "release.json idea_id is not a number";; esac
          out version "$version"
          out idea_id "$idea_id"

          # blast-radius check: nothing outside games/ (+ gitignored agent/ scratch) may change
          illegal=$(git status --porcelain | awk '{print $2}' | grep -vE '^(games/|agent/)' || true)
          [ -z "$illegal" ] || fail "developer touched forbidden files: $illegal"
          old_changed=$(git diff --name-only -- games/ | grep -vE "index.v${version}.html|latest.json|CHANGELOG.md" || true)
          [ -z "$old_changed" ] || fail "developer edited history: $old_changed"

          # run the verifier from HEAD, not the working tree — agent/ is a
          # permitted write path, so the agent could otherwise tamper with it
          git show HEAD:agent/verify_game.py > "$RUNNER_TEMP/verify_pristine.py"
          uv run "$RUNNER_TEMP/verify_pristine.py" verify "games/index.v${version}.html" || fail "verification gate rejected the build"
          out verdict success

      - name: publish evidence
        if: steps.ideas.outputs.count != '0' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-cycle-evidence
          path: |
            agent/screenshots/
            agent/claude_transcript.jsonl
            agent/claude_stderr.log
          if-no-files-found: ignore

      - name: ship it
        if: steps.ideas.outputs.count != '0' && steps.gate.outputs.verdict == 'success'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          SUMMARY: ${{ steps.gate.outputs.summary }}
          IDEA_ID: ${{ steps.gate.outputs.idea_id }}
          SPEND: ${{ steps.agent.outputs.spend_cents }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "the developer"
          git config user.email "bird@users.noreply.github.com"
          # credentials exist only in this step, after the gate has passed
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          git add games/
          SPEND=${SPEND:-0}
          cost=$(printf '%d.%02d' $((SPEND / 100)) $((SPEND % 100)))
          git commit -m "v${VERSION}: ${SUMMARY}" \
                     -m "idea #${IDEA_ID}, chosen and implemented autonomously. cost: \$${cost}"
          git push

      - name: archive the transcript (permanent telemetry)
        if: steps.ideas.outputs.count != '0' && always()
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
          VERSION: ${{ steps.gate.outputs.version }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -s agent/claude_transcript.jsonl ]; then
            echo "no transcript to archive"; exit 0
          fi
          mkdir -p transcripts
          if [ "$VERDICT" = "success" ] && [ -n "$VERSION" ]; then
            dest="transcripts/v${VERSION}.jsonl.gz"
          else
            dest="transcripts/failed-run-${RUN_ID}.jsonl.gz"
          fi
          gzip -c agent/claude_transcript.jsonl > "$dest"
          git config user.name "the developer"
          git config user.email "bird@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          git add transcripts/
          git commit -m "telemetry: agent transcript ($(basename "$dest"))"
          git push || { git pull --rebase && git push; }

      - name: report back to the mothership
        if: steps.ideas.outputs.count != '0' && always()
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
          REASON: ${{ steps.gate.outputs.reason }}
          SUMMARY: ${{ steps.gate.outputs.summary }}
          VERSION: ${{ steps.gate.outputs.version }}
          IDEA_ID: ${{ steps.gate.outputs.idea_id }}
          SPEND: ${{ steps.agent.outputs.spend_cents }}
        run: |
          verdict="${VERDICT:-failed}"
          summary="$SUMMARY"
          if [ "$verdict" = "failed" ]; then
            summary="${REASON:-the developer failed in a way it could not even report}"
          fi
          jq -n \
            --arg status "$verdict" \
            --arg version "$VERSION" \
            --arg idea_id "$IDEA_ID" \
            --arg spend "${SPEND:-0}" \
            --arg summary "$summary" \
            '{status:$status, spend_cents:(($spend|tonumber?) // 0), summary:$summary}
             + (if $status == "success"
                then {version:(($version|tonumber?) // null), idea_id:(($idea_id|tonumber?) // null)}
                else {} end)' \
            | curl -fsS -X POST "$APP_URL/api/agent/complete" \
                -H "Authorization: Bearer $AGENT_TOKEN" -H "content-type: application/json" -d @-
